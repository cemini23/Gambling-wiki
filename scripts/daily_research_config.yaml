loop:
  recency_window_days: 10
  max_results_per_query: 4
fetch:
  enabled: true
  max_downloads: 12
  fetch_likely: true
  max_results_per_paper_query: 6
  sources:
  - arxiv
  - openreview
arxiv_fallback:
  enabled: true
  request_interval_seconds: 3
  max_terms_per_query: 6
active_topics:
- Poker & arena bots (W6) — Researcher Round HU sandbox (Jun 21 β), MAFP/verifier
  steals, dev.fun decide(), HL loop (→ OSINT agents/devfun-poker-arena/briefs/)
- CeminiDFS (W9/K125) — nflverse projection, ownership sim, pydfs MME, calibration
  vs Stokastic (→ ../projects/CeminiDFS/briefs/)
- K147 pick'em/props (W10) — PrizePicks/UD fair value, slip EV, manual line workflow
  (→ wiki/concepts/diy-nfl-pickem-props-tool-architecture.md)
- NFL 2026 season prep (W8) — Hard Rock +EV/CLV, FanDuel DFS GPP, Underdog/BBM7, props
  correlation
- DFS / best ball — BBM7, Underdog ADP movers, roster construction, ownership leverage
- Sports betting — +EV process, CLV, line shopping, NFL spreads/props, sharp vs soft
  books
- Bankroll & Kelly — fractional sizing, variance, responsible-gambling guardrails
- Gambling bot program — FOSS evals, API/ToS, per-platform lanes (W4)
- Prediction markets retail — Kalshi/Polymarket fees, FLB, cross-venue vs books
- World Cup 2026 — retail wagering, books vs PM divergence; ticket resale cross-ref
  @osint-wiki wc-ticket-monitor
brief_routing_note: 'Co-primary ingest (equal priority): poker-arena · ceminidfs.

  Full ingest briefs route per `scripts/active_project_brief_targets.yaml`.

  poker-arena → OSINT agents/devfun-poker-arena/briefs/ · CeminiDFS → ../CeminiDFS/briefs/

  nfl-w8 → briefs/ (wiki-only). Prod bot deploy stays @osint-wiki.

  '
paper_queries:
- cluster: poker-exploit-arxiv
  query: arxiv poker OR holdem OR texas holdem exploit suboptimal opponent imperfect
    information
  category: research paper
- cluster: poker-llm-tools-arxiv
  query: arxiv poker LLM game-theoretic CFR solver tool use holdem -robot -robotics
  category: research paper
- cluster: poker-imperfect-info
  query: arxiv poker Texas holdem imperfect information opponent modeling CFR consistent
  category: research paper
- cluster: poker-openreview
  query: openreview poker Texas holdem reinforcement learning opponent modeling exploit
  category: research paper
- cluster: poker-hu-researcher-arxiv
  query: arxiv heads-up poker Texas holdem sandbox benchmark agent evaluation TrueSkill
  category: research paper
- cluster: poker-mafp-arxiv
  query: arxiv multi-agent fictitious play poker game theory equilibrium
  category: research paper
- cluster: sports-betting-arxiv
  query: arxiv sports betting wagering odds market efficiency closing line value bookmaker
  category: research paper
- cluster: pm-retail-arxiv
  query: arxiv Polymarket Kalshi prediction market event contract trading microstructure
  category: research paper
- cluster: pm-openreview
  query: openreview prediction market prophets profit arbitrage forecast coherence
    Polymarket
  category: research paper
- cluster: dfs-roster-arxiv
  query: arxiv daily fantasy sports lineup roster optimization ownership DraftKings
    FanDuel
  category: research paper
- cluster: cemini-dfs-nflverse-paper
  query: arxiv nflverse play-by-play NFL player usage projection fantasy football
    python
  category: research paper
- cluster: cemini-dfs-ownership-paper
  query: arxiv daily fantasy sports ownership projection simulation copula monte carlo
    GPP
  category: research paper
- cluster: kelly-bankroll-arxiv
  query: arxiv Kelly criterion sports betting bankroll wager sizing gambling
  category: research paper
