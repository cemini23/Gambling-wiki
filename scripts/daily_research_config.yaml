  category: news
- cluster: poker-hu-exploit
  query: poker heads-up NLHE opponent modeling exploit LLM agent MAFP fictitious play
    verifier 2026
  category: news
- cluster: poker-agent-dataset
  query: arena-pokerkit-hands huggingface poker agent dataset devfun
  category: news
- cluster: nfl-sportsbook
  query: NFL 2026 betting spread props closing line value line shopping sharp money
    preseason
  category: news
- cluster: nfl-hard-rock
  query: '"Hard Rock Bet" OR "Hard Rock Sportsbook" NFL odds promo bonus 2026'
  category: news
- cluster: nfl-fanduel-dfs
  query: FanDuel NFL DFS GPP ownership stacking showdown slate strategy 2026
  category: news
- cluster: cemini-dfs-nflverse
  query: nflverse play-by-play NFL DFS projection python FanDuel salary modeling open
    source
  category: news
- cluster: cemini-pickem-props
  query: PrizePicks OR Underdog pickem OR player props fair value DFS lounge demon
    goblin power play flex NFL
  category: news
- cluster: cemini-pickem-paid-bench
  query: PickLabs OR FantasyLabs player props pickem edge OR Unabated prop model NFL
  category: news
- cluster: cemini-dfs-calibration
  query: Stokastic OR FantasyLabs NFL DFS projection benchmark calibration ownership
    accuracy
  category: news
- cluster: cemini-dfs-pydfs
  query: pydfs-lineup-optimizer FanDuel MME lineup generation late swap NFL DFS
  category: news
- cluster: cemini-dfs-weather-injury
  query: NFL DFS weather adjustment injury report projection model Vegas implied team
    total
  category: news
- cluster: nfl-underdog-bbm
  query: Underdog "Best Ball Mania" OR BBM7 NFL ADP risers fallers draft strategy
    2026
  category: news
- cluster: nfl-preseason-camp
  query: NFL training camp injury report betting line movement depth chart 2026
  category: news
- cluster: sports-betting-ev
  query: '"sports betting" closing line value OR positive EV OR line shopping OR sharp
    money NFL'
  category: news
- cluster: dfs-best-ball
  query: '"best ball" OR Underdog fantasy OR DraftKings best ball roster construction
    ADP NFL'
  category: news
- cluster: kalshi-pm-retail
  query: '"Kalshi" OR "Polymarket" sports betting OR event contract retail OR prediction
    market fees'
  category: news
- cluster: world-cup-2026-wagering
  query: '"World Cup 2026" betting odds OR prediction market OR advance market futures'
  category: news
monokern_pipeline:
  enabled: true
  cadence: weekly
  default_deliverable: none
  source_modules:
  - yt-dlp
  - inbox_pdf
  - web_url
  ingest_hook: After weekly digest, one NotebookLM pass on co-primary topic (W6 poker
    Researcher Round, W9 CeminiDFS, or W8 NFL)
social:
  manual_pass:
  - tool: opencli-reader
    prompt: Reddit r/poker + dev.fun arena Researcher Round HU; r/dailyfantasysports
      NFL; r/sportsbook last 24h
  - tool: twitter-reader
    prompt: dev.fun poker HU sandbox MAFP verifier; NFL DFS FanDuel pydfs; Underdog
      BBM7 ADP last 24h
output:
  path_template: wiki/sweeps/{date}-daily.md
