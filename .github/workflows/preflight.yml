name: Preflight

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 06:00 UTC — full deploy gate (self-play audits).
    - cron: "0 6 * * 0"

jobs:
  cemini-preflight:
    name: cemini preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agents/devfun-poker-arena
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dev deps
        run: uv sync --extra dev
      - name: Seed private HUD stub for CI
        run: |
          mkdir -p private
          if [[ ! -f private/opponent_hud_exploit.py ]]; then
            cp examples/opponent_hud_stub.py private/opponent_hud_exploit.py
          fi
          touch private/__init__.py
      - name: Run preflight gate
        run: ./scripts/cemini_preflight.sh
